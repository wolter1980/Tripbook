[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tripbook"
dynamic = ["version"]
description = "Open-source vehicle trip logbook for SkyTraq-based GPS trackers, compatible with Little LogBook"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Tripbook contributors" }]
requires-python = ">=3.11"
dependencies = ["PySide6>=6.5"]
keywords = ["logbook", "mileage", "gps", "tracker", "skytraq", "little logbook", "tax", "business travel"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Topic :: Scientific/Engineering :: GIS",
]

[project.urls]
Homepage = "https://github.com/wolter1980/Tripbook"
Issues = "https://github.com/wolter1980/Tripbook/issues"
Changelog = "https://github.com/wolter1980/Tripbook/blob/main/CHANGELOG.md"

[project.gui-scripts]
tripbook = "tripbook.app:main"

[tool.setuptools]
packages = ["tripbook"]

[tool.setuptools.package-data]
tripbook = ["tripbook.svg"]

[tool.setuptools.dynamic]
version = { attr = "tripbook.__version__" }
