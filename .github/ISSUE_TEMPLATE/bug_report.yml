name: Bug report
description: Something doesn't work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Please don't attach your logbook (`tripbook.db`), tracker dumps (`.bin`),
        Little LogBook databases or GPX files** – they show where you live and drive.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Click …
  - type: input
    id: version
    attributes:
      label: Tripbook version
      description: Help → About Tripbook
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Linux, macOS, Windows]
    validations:
      required: true
  - type: input
    id: details
    attributes:
      label: OS version, Python and PySide6 versions
      placeholder: Fedora 44, Python 3.14, PySide6 6.11
  - type: input
    id: tracker
    attributes:
      label: Tracker (if involved)
      placeholder: Little LogBook (new generation, 0483:5740) / Little LogBook GO / old generation
  - type: textarea
    id: log
    attributes:
      label: Log
      description: The relevant lines from `tripbook.log` in the data folder (check them for personal details first).
      render: text
